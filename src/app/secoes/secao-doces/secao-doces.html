<section id="doces" class="secao secao--apoio" aria-labelledby="titulo-doces" tabindex="-1">
  <div class="container">
    <app-cabecalho-secao
      idTitulo="titulo-doces"
      sobretitulo="Não é só cookie"
      titulo="Mais doces da"
      destaque="casa."
    />

    <ul class="doces" id="lista-de-doces" #lista>
      @for (doce of catalogo.doces(); track doce.slug; let indice = $index) {
        <li
          [id]="'produto-' + doce.slug"
          [hidden]="!expandido() && indice >= visiveis"
          [appRevelar]="(indice % 2) * 90"
        >
          <app-cartao-produto variante="padrao" [produto]="doce" (pedir)="pedido.abrir($event)" />
        </li>
      }
    </ul>

    @if (temMais()) {
      <div class="doces__mais">
        <button
          #verTodos
          type="button"
          appBotao
          variante="contorno"
          aria-controls="lista-de-doces"
          [attr.aria-expanded]="expandido()"
          (click)="alternar()"
        >
          @if (expandido()) {
            Mostrar menos
          } @else {
            Ver todos os doces ({{ catalogo.doces().length }})
          }
          <app-icone nome="chevron-down" [class.doces__seta--aberta]="expandido()" />
        </button>
      </div>
    }
  </div>
</section>
